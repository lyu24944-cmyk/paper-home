name: Deploy Paper Home to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      allow_sample_fallback:
        description: "Allow seeding starter sample content if local-data/cottage.json is missing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify snapshot data source
        run: |
          if [ ! -f "local-data/cottage.json" ]; then
            if [ "${{ inputs.allow_sample_fallback }}" = "true" ]; then
              echo "local-data/cottage.json missing; seeding neutral starter sample via init:sample"
              npm run init:sample
            else
              echo "::error::Missing local-data/cottage.json. Publish and stage local-data/ first, or re-run with allow_sample_fallback=true for a demo build."
              exit 1
            fi
          fi

      - name: Build static cottage snapshot
        run: npm run build:local

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
