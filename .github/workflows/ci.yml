name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verification:
        description: "Full release gate or an explicit interaction-only diagnostic"
        required: true
        default: full
        type: choice
        options: [full, interactions, remaining]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAPER_HOME_FORCE_LOCAL: "1"
      QA_SOFTWARE_WEBGL: "1"
      QA_WEBGL_BACKEND: "mesa"
      LIBGL_ALWAYS_SOFTWARE: "1"
      DEBUG: "pw:browser"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify clean checkout serially
        if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full'
        run: xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24" npm run check:ci
      - name: Diagnose interactions only (not the full release gate)
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'interactions'
        run: xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24" npm run check:interactions
      - name: Diagnose remaining five gates (not the full release gate)
        if: github.event_name == 'workflow_dispatch' && inputs.verification == 'remaining'
        run: xvfb-run --auto-servernum --server-args="-screen 0 2560x1600x24" node scripts/ci-verify.mjs --remaining
      - name: Record full verification revision and results
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.verification == 'full')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const read = (file) => fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : []
          const steps = read('.qa/ci-results.json')
          const regressions = read('.qa/regression/results.json')
          const passed = steps.length === 17 && regressions.length === 26 &&
            [...steps, ...regressions].every(row => row.exitCode === 0)
          const summary = {
            commit: process.env.GITHUB_SHA,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            recordedAt: new Date().toISOString(),
            passed, steps, regressions,
          }
          fs.mkdirSync('.qa', { recursive: true })
          fs.writeFileSync('.qa/verification-summary.json', JSON.stringify(summary, null, 2))
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Full verification: ${passed ? 'PASS' : 'FAIL / INCOMPLETE'}\n\nCommit: \`${summary.commit}\`\n\n[Run](${summary.runUrl})\n\nSteps: ${steps.filter(row => row.exitCode === 0).length}/17; regressions: ${regressions.filter(row => row.exitCode === 0).length}/26.\n`)
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            .qa/ci-results.json
            .qa/verification-summary.json
            .qa/ci-remaining-results.json
            .qa/sound-verify/
            .qa/polish/after/verification.json
            .qa/polish/after/edge-cases.json
            .qa/polish/after/failure.png
            .qa/regression/
            .qa/phase2-verify/downloads/
            .qa/phase2-verify/diagnostics/
          retention-days: 7
